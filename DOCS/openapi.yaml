openapi: 3.0.3
info:
  title: API do Sistema de Agendamento — MVP
  version: 1.0.0
  description: Contrato do MVP (Fase 1). Datas em UTC (ISO 8601); valores monetários em BRL. Erros seguem RFC 7807
    com o campo `codigo`. O estabelecimento é sempre derivado do token (rotas públicas usam o cabeçalho `X-Estabelecimento`).
servers:
- url: https://localhost:7080/api/v1
  description: Desenvolvimento
- url: https://{host}/api/v1
  description: Produção
  variables:
    host:
      default: api.exemplo.com
tags:
- name: Autenticação
- name: Público
- name: Sistema
- name: Unidades
- name: Clientes
- name: Especialidades
- name: Serviços
- name: Profissionais
- name: Agenda
- name: Agendamentos
- name: Comandas e pagamentos
- name: Comissões
- name: Relatórios
- name: Usuários
- name: Configurações
paths:
  /auth/login:
    post:
      tags:
      - Autenticação
      operationId: Autenticacao_Login
      summary: Autentica usuário da equipe
      description: '**Perfis:** Público (sem token).


        **Erros:** 400 VAL_INVALIDO; 401 AUTH_CREDENCIAIS; 429 RATE_LIMIT.'
      x-perfis: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
  /auth/refresh:
    post:
      tags:
      - Autenticação
      operationId: Autenticacao_Refresh
      summary: Renova o token de acesso
      description: '**Perfis:** Público (sem token).


        **Erros:** 401 AUTH_TOKEN_EXPIRADO.'
      x-perfis: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/E401'
        '500':
          $ref: '#/components/responses/E500'
  /auth/logout:
    post:
      tags:
      - Autenticação
      operationId: Autenticacao_Logout
      summary: Encerra a sessão (revoga o refresh token)
      description: '**Perfis:** Admin, Recepcao, Profissional, Cliente.'
      x-perfis:
      - Admin
      - Recepcao
      - Profissional
      - Cliente
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Sem conteúdo
        '401':
          $ref: '#/components/responses/E401'
        '500':
          $ref: '#/components/responses/E500'
  /auth/cliente/solicitar-codigo:
    post:
      tags:
      - Autenticação
      operationId: Autenticacao_SolicitarCodigo
      summary: Envia código OTP ao telefone do cliente
      description: '**Perfis:** Público (sem token).


        **Erros:** 400 VAL_INVALIDO; 429 RATE_LIMIT.'
      x-perfis: []
      security: []
      parameters:
      - $ref: '#/components/parameters/XEstabelecimento'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarCodigoRequest'
      responses:
        '202':
          description: Aceito
        '400':
          $ref: '#/components/responses/E400'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
  /auth/cliente/verificar-codigo:
    post:
      tags:
      - Autenticação
      operationId: Autenticacao_VerificarCodigo
      summary: Valida o OTP e devolve tokens com perfil Cliente
      description: '**Perfis:** Público (sem token).


        **Erros:** 401 AUTH_OTP_INVALIDO; 429 RATE_LIMIT.'
      x-perfis: []
      security: []
      parameters:
      - $ref: '#/components/parameters/XEstabelecimento'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificarCodigoRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenClienteResponse'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
  /publico/estabelecimento:
    get:
      tags:
      - Público
      operationId: Publico_ObterEstabelecimento
      summary: Dados da página pública de agendamento
      description: '**Perfis:** Público (sem token).


        **Erros:** 404 RECURSO_NAO_ENCONTRADO.'
      x-perfis: []
      security: []
      parameters:
      - $ref: '#/components/parameters/XEstabelecimento'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstabelecimentoPublico'
        '404':
          $ref: '#/components/responses/E404'
        '500':
          $ref: '#/components/responses/E500'
  /publico/politica-privacidade:
    get:
      tags:
      - Público
      operationId: Publico_ObterPoliticaPrivacidade
      summary: Termo de consentimento LGPD vigente
      description: '**Perfis:** Público (sem token).


        **Erros:** 404 RECURSO_NAO_ENCONTRADO.'
      x-perfis: []
      security: []
      parameters:
      - $ref: '#/components/parameters/XEstabelecimento'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaPrivacidade'
        '404':
          $ref: '#/components/responses/E404'
        '500':
          $ref: '#/components/responses/E500'
  /health:
    get:
      tags:
      - Sistema
      operationId: Sistema_Health
      summary: Processo no ar (liveness)
      description: '**Perfis:** Público (sem token).'
      x-perfis: []
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/E500'
  /health/ready:
    get:
      tags:
      - Sistema
      operationId: Sistema_HealthReady
      summary: Banco e dependências OK (readiness)
      description: '**Perfis:** Público (sem token).


        **Erros:** 503 Dependência indisponível.'
      x-perfis: []
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
  /webhooks/mensageria:
    post:
      tags:
      - Sistema
      operationId: Sistema_WebhookMensageria
      summary: Recebe respostas do provedor de mensagens (assinatura HMAC no cabeçalho)
      description: '**Perfis:** Público (sem token).


        **Erros:** 401 Assinatura inválida.'
      x-perfis: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MensageriaWebhook'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/E401'
        '500':
          $ref: '#/components/responses/E500'
  /unidades:
    get:
      tags:
      - Unidades
      operationId: Unidades_Listar
      summary: Lista unidades
      description: '**Perfis:** Admin, Recepcao, Profissional, Cliente.'
      x-perfis:
      - Admin
      - Recepcao
      - Profissional
      - Cliente
      security:
      - bearerAuth: []
      parameters:
      - name: ativo
        in: query
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaUnidade'
        '401':
          $ref: '#/components/responses/E401'
        '500':
          $ref: '#/components/responses/E500'
    post:
      tags:
      - Unidades
      operationId: Unidades_Criar
      summary: Cria unidade
      description: '**Perfis:** Admin.


        **Erros:** 400 VAL_INVALIDO; 409 Nome duplicado.'
      x-perfis:
      - Admin
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnidadeRequest'
      responses:
        '201':
          description: Criado
          headers:
            Location:
              description: URL do recurso criado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unidade'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '500':
          $ref: '#/components/responses/E500'
  /unidades/{id}:
    get:
      tags:
      - Unidades
      operationId: Unidades_ObterPorId
      summary: Detalha uma unidade
      description: '**Perfis:** Admin, Recepcao, Profissional, Cliente.


        **Erros:** 404 RECURSO_NAO_ENCONTRADO.'
      x-perfis:
      - Admin
      - Recepcao
      - Profissional
      - Cliente
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unidade'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
        '500':
          $ref: '#/components/responses/E500'
    put:
      tags:
      - Unidades
      operationId: Unidades_Atualizar
      summary: Atualiza unidade
      description: '**Perfis:** Admin.


        **Erros:** 400 VAL_INVALIDO; 404 RECURSO_NAO_ENCONTRADO.'
      x-perfis:
      - Admin
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnidadeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unidade'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '500':
          $ref: '#/components/responses/E500'
    delete:
      tags:
      - Unidades
      operationId: Unidades_Inativar
      summary: Inativa unidade (soft delete)
      description: '**Perfis:** Admin.


        **Erros:** 404 RECURSO_NAO_ENCONTRADO; 409 CAD_POSSUI_AGENDAMENTOS_FUTUROS.'
      x-perfis:
      - Admin
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Sem conteúdo
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '500':
          $ref: '#/components/responses/E500'
  /clientes:
    get:
      tags:
      - Clientes
      operationId: Clientes_Listar
      summary: Lista clientes
      description: '**Perfis:** Admin, Recepcao.'
      x-perfis:
      - Admin
      - Recepcao
      security:
      - bearerAuth: []
      parameters:
      - name: busca
        in: query
        required: false
        schema:
          type: string
      - name: ativo
        in: query
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaCliente'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '500':
          $ref: '#/components/responses/E500'
    post:
      tags:
      - Clientes
      operationId: Clientes_Criar
      summary: Cadastra cliente (inclusive autocadastro)
      description: '**Perfis:** Admin, Recepcao, Cliente.


        **Erros:** 400 VAL_INVALIDO; 409 CAD_TELEFONE_DUPLICADO; 422 CAD_LGPD_OBRIGATORIO.'
      x-perfis:
      - Admin
      - Recepcao
      - Cliente
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
      responses:
        '201':
          description: Criado
          headers:
            Location:
              description: URL do recurso criado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '500':
          $ref: '#/components/responses/E500'
  /clientes/{id}:
    get:
      tags:
      - Clientes
      operationId: Clientes_ObterPorId
      summary: Detalha cliente
      description: '**Perfis:** Admin, Recepcao, Cliente (somente o próprio).


        **Erros:** 403 AUTH_PERMISSAO; 404 RECURSO_NAO_ENCONTRADO.'
      x-perfis:
      - Admin
      - Recepcao
      - Cliente
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '500':
          $ref: '#/components/responses/E500'
    put:
      tags:
      - Clientes
      operationId: Clientes_Atualizar
      summary: Atualiza cliente
      description: '**Perfis:** Admin, Recepcao, Cliente (somente o próprio).


        **Erros:** 400 VAL_INVALIDO; 403 AUTH_PERMISSAO; 404 RECURSO_NAO_ENCONTRADO; 409 CAD_TELEFONE_DUPLICADO.'
      x-perfis:
      - Admin
      - Recepcao
      - Cliente
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '500':
          $ref: '#/components/responses/E500'
    delete:
      tags:
      - Clientes
      operationId: Clientes_Inativar
      summary: Inativa cliente (soft delete)
      description: '**Perfis:** Admin.


        **Erros:** 404 RECURSO_NAO_ENCONTRADO.'
      x-perfis:
      - Admin
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Sem conteúdo
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '500':
          $ref: '#/components/responses/E500'
  /clientes/{id}/agendamentos:
    get:
      tags:
      - Clientes
      operationId: Clientes_ListarAgendamentos
      summary: Histórico de agendamentos do cliente
      description: '**Perfis:** Admin, Recepcao, Cliente (somente o próprio).


        **Erros:** 403 AUTH_PERMISSAO; 404 RECURSO_NAO_ENCONTRADO.'
      x-perfis:
      - Admin
      - Recepcao
      - Cliente
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/StatusAgendamento'
      - name: de
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: ate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaAgendamentoResumo'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '500':
          $ref: '#/components/responses/E500'
  /especialidades:
    get:
      tags:
      - Especialidades
      operationId: Especialidades_Listar
      summary: Lista especialidades
      description: '**Perfis:** Admin, Recepcao, Profissional, Cliente.'
      x-perfis:
      - Admin
      - Recepcao
      - Profissional
      - Cliente
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Especialidade'
        '401':
          $ref: '#/components/responses/E401'
        '500':
          $ref: '#/components/responses/E500'
    post:
      tags:
      - Especialidades
      operationId: Especialidades_Criar
      summary: Cria especialidade
      description: '**Perfis:** Admin.


        **Erros:** 400 VAL_INVALIDO; 409 Nome duplicado.'
      x-perfis:
      - Admin
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EspecialidadeRequest'
      responses:
        '201':
          description: Criado
          headers:
            Location:
              description: URL do recurso criado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Especialidade'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '500':
          $ref: '#/components/responses/E500'
  /servicos:
    get:
      tags:
      - Serviços
      operationId: Servicos_Listar
      summary: Lista serviços
      description: '**Perfis:** Admin, Recepcao, Profissional, Cliente.'
      x-perfis:
      - Admin
      - Recepcao
      - Profissional
      - Cliente
      security:
      - bearerAuth: []
      parameters:
      - name: especialidadeId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: ativo
        in: query
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaServico'
        '401':
          $ref: '#/components/responses/E401'
        '500':
          $ref: '#/components/responses/E500'
    post:
      tags:
      - Serviços
      operationId: Servicos_Criar
      summary: Cria serviço (duração > 0, preço >= 0)
      description: '**Perfis:** Admin.


        **Erros:** 400 VAL_INVALIDO; 404 RECURSO_NAO_ENCONTRADO.'
      x-perfis:
      - Admin
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicoRequest'
      responses:
        '201':
          description: Criado
          headers:
            Location:
              description: URL do recurso criado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Servico'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '500':
          $ref: '#/components/responses/E500'
  /servicos/{id}:
    get:
      tags:
      - Serviços
      operationId: Servicos_ObterPorId
      summary: Detalha serviço
      description: '**Perfis:** Admin, Recepcao, Profissional, Cliente.


        **Erros:** 404 RECURSO_NAO_ENCONTRADO.'
      x-perfis:
      - Admin
      - Recepcao
      - Profissional
      - Cliente
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Servico'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
        '500':
          $ref: '#/components/responses/E500'
    put:
      tags:
      - Serviços
      operationId: Servicos_Atualizar
