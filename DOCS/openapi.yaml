                $ref: '#/components/schemas/Configuracoes'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '500':
          $ref: '#/components/responses/E500'
    put:
      tags:
      - Configurações
      operationId: Configuracoes_Atualizar
      summary: Atualiza regras (antecedência, multas, intervalos...)
      description: '**Perfis:** Admin.


        **Erros:** 400 VAL_INVALIDO.'
      x-perfis:
      - Admin
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Configuracoes'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuracoes'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '500':
          $ref: '#/components/responses/E500'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Pagina:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Tamanho:
      name: tamanho
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    XEstabelecimento:
      name: X-Estabelecimento
      in: header
      required: true
      description: Slug do estabelecimento (rotas públicas)
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: GUID para repetir a chamada sem duplicar efeitos
      schema:
        type: string
        format: uuid
  responses:
    E400:
      description: Requisição inválida (VAL_INVALIDO)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    E401:
      description: Não autenticado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    E403:
      description: Sem permissão (AUTH_PERMISSAO)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    E404:
      description: Não encontrado (RECURSO_NAO_ENCONTRADO)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    E409:
      description: Conflito de estado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    E422:
      description: Regra de negócio violada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    E429:
      description: Excesso de requisições (RATE_LIMIT)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    E500:
      description: Erro interno
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    E503:
      description: Serviço indisponível
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    Perfil:
      type: string
      enum:
      - Admin
      - Recepcao
      - Profissional
      - Cliente
    StatusAgendamento:
      type: string
      enum:
      - PENDENTE
      - CONFIRMADO
      - EM_ATENDIMENTO
      - CONCLUIDO
      - CANCELADO
      - NO_SHOW
      - REMARCADO
    StatusComanda:
      type: string
      enum:
      - ABERTA
      - PAGA
      - CANCELADA
    StatusPagamento:
      type: string
      enum:
      - CONFIRMADO
      - ESTORNADO
    StatusComissao:
      type: string
      enum:
      - PENDENTE
      - PAGA
      - REVERTIDA
    FormaPagamento:
      type: string
      enum:
      - PIX
      - CARTAO_CREDITO
      - CARTAO_DEBITO
      - DINHEIRO
    OrigemAgendamento:
      type: string
      enum:
      - APP
      - SITE
      - BALCAO
      - TELEFONE
      - WHATSAPP
    TipoDesconto:
      type: string
      enum:
      - VALOR
      - PERCENTUAL
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        codigo:
          type: string
          description: Código de erro de negócio (ex. AGE_HORARIO_OCUPADO)
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
        erros:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Erros por campo (somente 400)
    HealthResponse:
      type: object
      properties:
        status:
          type: string
    LoginRequest:
      type: object
      required:
      - email
      - senha
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
    RefreshRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    UsuarioResumo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        perfil:
          $ref: '#/components/schemas/Perfil'
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiraEm:
          type: string
          format: date-time
        usuario:
          $ref: '#/components/schemas/UsuarioResumo'
    SolicitarCodigoRequest:
      type: object
      required:
      - telefone
      properties:
        telefone:
          type: string
    VerificarCodigoRequest:
      type: object
      required:
      - telefone
      - codigo
      properties:
        telefone:
          type: string
        codigo:
          type: string
    TokenClienteResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiraEm:
          type: string
          format: date-time
        clienteExistente:
          type: boolean
    MensageriaWebhook:
      type: object
      additionalProperties: true
    EstabelecimentoPublico:
      type: object
      properties:
        nome:
          type: string
        logoUrl:
          type: string
        unidades:
          type: array
          items:
            $ref: '#/components/schemas/Unidade'
        servicos:
          type: array
          items:
            $ref: '#/components/schemas/Servico'
    PoliticaPrivacidade:
      type: object
      properties:
        versao:
          type: string
        texto:
          type: string
    Unidade:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        endereco:
          type: string
        telefone:
          type: string
        abreAs:
          type: string
          format: time
          example: 09:00:00
        fechaAs:
          type: string
          format: time
          example: 09:00:00
        fusoHorario:
          type: string
        ativo:
          type: boolean
    UnidadeRequest:
      type: object
      required:
      - nome
      - endereco
      - abreAs
      - fechaAs
      - fusoHorario
      properties:
        nome:
          type: string
        endereco:
          type: string
        telefone:
          type: string
        abreAs:
          type: string
          format: time
          example: 09:00:00
        fechaAs:
          type: string
          format: time
          example: 09:00:00
        fusoHorario:
          type: string
          example: America/Sao_Paulo
    Cliente:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        telefone:
          type: string
        email:
          type: string
        dataNascimento:
          type: string
          format: date
        observacoes:
          type: string
          description: Dado sensível; somente Admin e Recepcao
        consentimentoLgpd:
          type: boolean
        totalNoShows:
          type: integer
          format: int32
        ativo:
          type: boolean
    ClienteRequest:
      type: object
      required:
      - nome
      - telefone
      - consentimentoLgpd
      properties:
        nome:
          type: string
        telefone:
          type: string
        email:
          type: string
          format: email
        dataNascimento:
          type: string
          format: date
        observacoes:
          type: string
        consentimentoLgpd:
          type: boolean
    Especialidade:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
    EspecialidadeRequest:
      type: object
      required:
      - nome
      properties:
        nome:
          type: string
    Servico:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        especialidadeId:
          type: integer
          format: int64
        duracaoMin:
          type: integer
          format: int32
        preco:
          type: number
          format: double
        ativo:
          type: boolean
    ServicoRequest:
      type: object
      required:
      - nome
      - especialidadeId
      - duracaoMin
      - preco
      properties:
        nome:
          type: string
        especialidadeId:
          type: integer
          format: int64
        duracaoMin:
          type: integer
          minimum: 1
        preco:
          type: number
          minimum: 0
    Profissional:
      type: object
      properties:
        id:
          type: integer
          format: int64
        unidadeId:
          type: integer
          format: int64
        nome:
          type: string
        comissaoPadrao:
          type: number
          format: double
        especialidadeIds:
          type: array
          items:
            type: integer
            format: int64
        ativo:
          type: boolean
    ProfissionalRequest:
      type: object
      required:
      - unidadeId
      - nome
      - comissaoPadrao
      properties:
        unidadeId:
          type: integer
          format: int64
        nome:
          type: string
        comissaoPadrao:
          type: number
          minimum: 0
          maximum: 100
        especialidadeIds:
          type: array
          items:
            type: integer
            format: int64
        usuarioId:
          type: integer
          format: int64
    ProfissionalServico:
      type: object
      properties:
        servicoId:
          type: integer
          format: int64
        nome:
          type: string
        precoEfetivo:
          type: number
          format: double
        duracaoEfetivaMin:
          type: integer
          format: int32
        comissaoEfetiva:
          type: number
          format: double
    ProfissionalServicoRequest:
      type: object
      required:
      - servicoId
      properties:
        servicoId:
          type: integer
          format: int64
        precoPersonalizado:
          type: number
          format: double
        duracaoPersonalizada:
          type: integer
          format: int32
        comissao:
          type: number
          format: double
    FaixaDisponibilidade:
      type: object
      required:
      - diaSemana
      - inicio
      - fim
      properties:
        diaSemana:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = domingo
        inicio:
          type: string
          format: time
          example: 09:00:00
        fim:
          type: string
          format: time
          example: 09:00:00
    Bloqueio:
      type: object
      properties:
        id:
          type: integer
          format: int64
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time
        motivo:
          type: string
    BloqueioRequest:
      type: object
      required:
      - inicio
      - fim
      properties:
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time
        motivo:
          type: string
    HorarioLivre:
      type: object
      properties:
        profissionalId:
          type: integer
          format: int64
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time
    HorariosLivresResponse:
      type: object
      properties:
        data:
          type: string
          format: date
        duracaoTotalMin:
          type: integer
          format: int32
        horarios:
          type: array
          items:
            $ref: '#/components/schemas/HorarioLivre'
    BloqueioAgenda:
      type: object
      properties:
        profissionalId:
          type: integer
          format: int64
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time
        motivo:
          type: string
    AgendaResponse:
      type: object
      properties:
        agendamentos:
          type: array
          items:
            $ref: '#/components/schemas/AgendamentoResumo'
        bloqueios:
          type: array
          items:
            $ref: '#/components/schemas/BloqueioAgenda'
    ClienteResumo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
    ProfissionalResumo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
    ItemAgendamento:
      type: object
      properties:
        servicoId:
          type: integer
          format: int64
        nome:
          type: string
        duracaoMin:
          type: integer
          format: int32
        precoCongelado:
          type: number
          format: double
    Agendamento:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/StatusAgendamento'
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time
        unidadeId:
          type: integer
          format: int64
        cliente:
          $ref: '#/components/schemas/ClienteResumo'
        profissional:
          $ref: '#/components/schemas/ProfissionalResumo'
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemAgendamento'
        valorTotal:
          type: number
          format: double
        origem:
          $ref: '#/components/schemas/OrigemAgendamento'
        criadoEm:
          type: string
          format: date-time
    AgendamentoResumo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/StatusAgendamento'
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time
        clienteNome:
          type: string
        profissionalId:
          type: integer
          format: int64
        profissionalNome:
          type: string
        valorTotal:
          type: number
          format: double
    CriarAgendamentoRequest:
      type: object
      required:
      - unidadeId
      - profissionalId
      - inicio
      - servicoIds
      properties:
        clienteId:
          type: integer
          format: int64
          description: Ignorado para o perfil Cliente (usa o do token)
        unidadeId:
          type: integer
          format: int64
        profissionalId:
          type: integer
          format: int64
        inicio:
          type: string
          format: date-time
        servicoIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
        origem:
          $ref: '#/components/schemas/OrigemAgendamento'
    CancelarRequest:
      type: object
      properties:
        motivo:
          type: string
    CancelarResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/StatusAgendamento'
        multaAplicada:
          type: boolean
        valorMulta:
          type: number
          format: double
    RemarcarRequest:
      type: object
      required:
      - novoInicio
      properties:
        novoInicio:
          type: string
          format: date-time
        profissionalId:
          type: integer
          format: int64
    ItemComanda:
      type: object
      properties:
        servicoId:
          type: integer
          format: int64
        nome:
          type: string
        preco:
          type: number
          format: double
    DescontoAplicado:
      type: object
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDesconto'
        valor:
          type: number
          format: double
        valorCalculado:
          type: number
          format: double
        motivo:
          type: string
    Pagamento:
      type: object
      properties:
        id:
          type: integer
          format: int64
        forma:
          $ref: '#/components/schemas/FormaPagamento'
        valor:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/StatusPagamento'
        pagoEm:
          type: string
          format: date-time
    Comanda:
      type: object
      properties:
        id:
          type: integer
          format: int64
        agendamentoId:
          type: integer
          format: int64
        clienteId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/StatusComanda'
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemComanda'
        descontos:
          type: array
          items:
            $ref: '#/components/schemas/DescontoAplicado'
        pagamentos:
          type: array
          items:
            $ref: '#/components/schemas/Pagamento'
        subtotal:
          type: number
          format: double
        desconto:
          type: number
          format: double
        total:
          type: number
          format: double
        saldo:
          type: number
          format: double
    CriarComandaRequest:
      type: object
      description: Informe agendamentoId OU (clienteId, profissionalId, servicoIds) para comanda avulsa
      properties:
        agendamentoId:
          type: integer
          format: int64
        clienteId:
          type: integer
          format: int64
        profissionalId:
          type: integer
          format: int64
        servicoIds:
          type: array
          items:
            type: integer
            format: int64
    DescontoRequest:
      type: object
      required:
      - tipo
      - valor
      - motivo
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDesconto'
        valor:
          type: number
          minimum: 0
        motivo:
          type: string
          minLength: 3
    PagamentoRequest:
      type: object
      required:
      - forma
      - valor
      properties:
        forma:
          $ref: '#/components/schemas/FormaPagamento'
        valor:
          type: number
          exclusiveMinimum: 0
    PagamentoResponse:
      type: object
      properties:
        pagamentoId:
          type: integer
          format: int64
        saldoRestante:
          type: number
          format: double
        statusComanda:
          $ref: '#/components/schemas/StatusComanda'
    EstornoRequest:
      type: object
      required:
      - motivo
      properties:
        motivo:
          type: string
          minLength: 3
    Comissao:
      type: object
      properties:
        id:
          type: integer
          format: int64
        comandaId:
          type: integer
          format: int64
        profissionalId:
          type: integer
          format: int64
        valor:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/StatusComissao'
        geradaEm:
          type: string
          format: date-time
    ComissaoResumoItem:
      type: object
      properties:
        profissionalId:
          type: integer
          format: int64
        profissionalNome:
          type: string
        totalComissao:
          type: number
          format: double
        quantidadeAtendimentos:
          type: integer
          format: int32
        porServico:
          type: array
          items:
            type: object
            properties:
              servicoId:
                type: integer
                format: int64
              nome:
                type: string
              total:
                type: number
                format: double
    FaturamentoItem:
      type: object
      properties:
        periodo:
          type: string
        valor:
          type: number
          format: double
        quantidadeAtendimentos:
          type: integer
          format: int32
    AtendimentoRelItem:
      type: object
      properties:
        chave:
          type: integer
          format: int64
        nome:
          type: string
        quantidade:
          type: integer
          format: int32
        valor:
          type: number
          format: double
    Usuario:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        perfil:
          $ref: '#/components/schemas/Perfil'
        ativo:
          type: boolean
    UsuarioCriarRequest:
      type: object
      required:
      - email
      - senhaInicial
      - perfil
      properties:
        email:
          type: string
          format: email
        senhaInicial:
          type: string
          format: password
          minLength: 8
        perfil:
          type: string
          enum:
          - Admin
          - Recepcao
          - Profissional
    UsuarioAtualizarRequest:
      type: object
      required:
      - perfil
      properties:
        perfil:
          $ref: '#/components/schemas/Perfil'
    SenhaRequest:
      type: object
      required:
      - novaSenha
      properties:
        senhaAtual:
          type: string
          format: password
        novaSenha:
          type: string
          format: password
          minLength: 8
    StatusRequest:
      type: object
      required:
      - ativo
      properties:
        ativo:
          type: boolean
    Configuracoes:
      type: object
      properties:
        antecedenciaMinimaMinutos:
          type: integer
          format: int32
        antecedenciaMaximaDias:
          type: integer
          format: int32
        prazoCancelamentoHoras:
          type: integer
          format: int32
        intervaloHigienizacaoMinutos:
          type: integer
          format: int32
        multaCancelamentoTardioPercentual:
          type: number
          format: double
        limiteDescontoRecepcaoPercentual:
          type: number
          format: double
        canaisNotificacao:
          type: array
          items:
            type: string
            enum:
            - WHATSAPP
            - SMS
            - EMAIL
        lembretesHorasAntes:
          type: array
          items:
            type: integer
            format: int32
    PaginaUnidade:
      type: object
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/Unidade'
        pagina:
          type: integer
        tamanho:
          type: integer
        totalItens:
          type: integer
        totalPaginas:
          type: integer
    PaginaCliente:
      type: object
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/Cliente'
        pagina:
          type: integer
        tamanho:
          type: integer
        totalItens:
          type: integer
        totalPaginas:
          type: integer
    PaginaAgendamentoResumo:
      type: object
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/AgendamentoResumo'
        pagina:
          type: integer
        tamanho:
          type: integer
        totalItens:
          type: integer
        totalPaginas:
          type: integer
    PaginaServico:
      type: object
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/Servico'
        pagina:
          type: integer
        tamanho:
          type: integer
        totalItens:
          type: integer
        totalPaginas:
